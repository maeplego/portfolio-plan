# Runs on push to master when a listed path changes, or by hand (workflow_dispatch).
# Work branches rely on local checks; run this by hand once before merging.
# Compose up, Playwright browsers, and Docker Desktop Kubernetes are not in this
# workflow: hosted runners have no Desktop cluster, and image builds are too slow
# for every run. See portfolio-plan/18-ci.md in the meta repo.
name: ci

on:
  push:
    branches: [master]
    paths:
      - "portfolio-plan/product-repos.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: product-repos.json is valid
        run: python -c "import json; json.load(open('portfolio-plan/product-repos.json', encoding='utf-8'))"

